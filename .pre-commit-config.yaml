repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, ref, docs, test, build, chore, config, ci]

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: scripts/go-fmt-stage.sh
        language: script
        types: [go]
        pass_filenames: true

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build-binaries
        name: go build binaries
        entry: scripts/go-build-binaries.sh
        language: script
        types: [go]
        pass_filenames: false
